<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Love Letter</title>
        <link
            href="https://fonts.bunny.net/css?family=instrument-sans:400,500,600"
            rel="stylesheet"
        />

        <link rel="stylesheet" href="styles.css" />
    </head>
    <body>
        <div class="container">
            <!-- Hearts Container -->
            <div class="hearts-container" id="heartsContainer">
                <!-- Hearts will be generated by JavaScript -->
            </div>

            <!-- Mailbox -->
            <div class="mailbox-wrapper" id="mailboxWrapper">
                <div class="mailbox" id="mailbox">
                    <img
                        src="images/close.png"
                        alt="closed mailbox"
                        class="mailbox-img closed"
                        id="closedMailbox"
                    />
                    <img
                        src="images/hopopen.png"
                        alt="open mailbox"
                        class="mailbox-img open"
                        id="openMailbox"
                    />
                </div>
            </div>

            <!-- Letter content -->
            <div class="letter" id="letter">
                <div class="corner-hearts">
                    <span class="heart tl">❤</span>
                    <span class="heart tr">❤</span>
                    <span class="heart bl">❤</span>
                    <span class="heart br">❤</span>
                </div>
                <div class="message" id="messageBox" style="font-size: 16px; white-space: pre-wrap; text-align: left;"></div>
            </div>
        </div>

        <!-- Audio element -->
        <audio id="backgroundMusic" loop>
            <source src="./assets/user_bg_music.mp3" type="audio/mpeg" />
            Your browser does not support the audio element.
        </audio>

        <script>
            window.CONFIG = {
                message: `Điều làm chị vui nhất trên đời là được gặp em, được lắng nghe và chia sẻ cùng em, được đồng hành với em qua buồn vui cuộc sống.
Dù em thế nào, dù chị không tốt ra sao vẫn mong em và chị đủ yêu thương nhau, đủ bao dung để mang đến hạnh phúc cho nhau. 
Hôm nay, được gặp em và nói đôi lời yêu đến em...chị bé rất ngại.
Ngại nói ra lời thật lòng, ngại đối phương chê cười, ngại thì ngại nhưng nói thì phải nói, xa cách lâu rồi giờ đối với chị đây là dịp hạnh phúc nhất khi được ở bên người mình thương. 
Em biết không! Chị mong chờ ngày này rất lâu, mong chờ được ôm em và tỏ bày tình cảm này cho em nghe, mong chờ thấy nụ cười hạnh phúc của em.
Chị bé ước một điều; Cô gái nhỏ của chị bé là ck yêu của chị bé không còn những áp lực và nỗi buồn trong lòng.
Chúc tình yêu của chị bé, mãi hạnh phúc và bình an, nhiêu đó thôi là chị vui rồi!!! `
            };
        </script>
        <script src="script.js"></script>
    	<!-- Cơ chế bảo mật (Chống soi code) -->
	<script src="./anti-devtools.js"></script>
</body>
</html>
